name: Update profile art

# Re-scrapes the public contribution calendar and re-renders contrib-heatmap.svg.
# Runs every day, on every push to main, and on demand (Actions tab -> Run workflow).

"on":
  schedule:
    - cron: "17 6 * * *"   # ~06:17 UTC (11:47 IST) daily
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Fetch contribution data (public, no token needed)
        run: python scripts/fetch_contributions.py
        env:
          GH_PROFILE_USER: ${{ github.repository_owner }}

      - name: Render animated contribution heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit refreshed art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          # [skip ci] stops this bot commit from re-triggering the push event
          commit_message: "chore: refresh contribution heatmap [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg"
